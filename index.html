<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#15171a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<body>
<canvas id="cv"></canvas>
<div id="hud" hidden>

<div id="act" hidden><button id="bFire" type="button" aria-pressed="true" aria-label="Tir auto"></button><button id="bHeal" type="button" aria-label="Soin"><i data-ic="heal"></i><span class="n" id="healn"></span></button><button id="bBag" type="button" aria-label="Sac"><i data-ic="bag"></i></button></div>

<div id="stash" class="screen"></div>
